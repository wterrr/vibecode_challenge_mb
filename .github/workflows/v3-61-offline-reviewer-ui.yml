name: V3-61 Offline Masked Reviewer UX and Integrity (NO MODEL API)
on:
  push:
    branches: [chatgpt/v3-61-offline-masked-reviewer-ui]
    paths:
      - "benchmarks/learnflowbench/v3/v3_61_offline_review_ui_preregister.json"
      - "learnflow_v3/review_ui/**"
      - "scripts/build_v3_61_review_ui.py"
      - "tests/v3/test_v3_61_*.py"
      - "tests/v3/test_v3_61_*.cjs"
      - ".github/workflows/v3-61-offline-reviewer-ui.yml"
  pull_request:
    paths:
      - "benchmarks/learnflowbench/v3/v3_61_offline_review_ui_preregister.json"
      - "learnflow_v3/review_ui/**"
      - "scripts/build_v3_61_review_ui.py"
      - "tests/v3/test_v3_61_*.py"
      - "tests/v3/test_v3_61_*.cjs"
      - ".github/workflows/v3-61-offline-reviewer-ui.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  strict-offline-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run native Node UI/CSV mutation checks
        run: |
          node --version
          node --check learnflow_v3/review_ui/v361_reviewer.js
          node --test tests/v3/test_v3_61_reviewer_ui.cjs
      - name: Run prereg, masking and packet negative tests
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<10"
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_61_review_ui.py
  real-native-masked-app-and-browser-smoke:
    needs: strict-offline-ui-contract
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and real browser test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check "playwright>=1.55,<1.70"
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
          command -v google-chrome || command -v chromium
      - name: Download frozen V3-60 native reviewer kit only
        run: |
          mkdir -p /tmp/v361-source
          curl --fail --show-error --silent --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/wterrr/vibecode_challenge_mb/actions/artifacts/11863660782/zip" \
            -o /tmp/v361-source.zip
          unzip -t /tmp/v361-source.zip
          unzip -q /tmp/v361-source.zip -d /tmp/v361-source
      - name: Verify nine source SHA and full video decode; build offline reviewer app
        run: |
          python scripts/build_v3_61_review_ui.py \
            --clips-dir /tmp/v361-source --output artifacts/v361/offline_review_ui \
            --full-decode
          test "$(find artifacts/v361/offline_review_ui/media -maxdepth 1 -name '*.mp4' | wc -l)" -eq 9
          test "$(find artifacts/v361/offline_review_ui -maxdepth 1 -name 'reviewer_*.html' | wc -l)" -eq 3
          test "$(find artifacts/v361/offline_review_ui -iname '*admin*' | wc -l)" -eq 0
      - name: 'Browser smoke: local file, completeness guard and zero network'
        run: |
          python tests/v3/test_v3_61_browser_smoke.py \
            --kit artifacts/v361/offline_review_ui
      - uses: actions/upload-artifact@v4
        with:
          name: v361-offline-assigned-masked-reviewer-ui-UNRATED
          path: artifacts/v361/offline_review_ui/
          if-no-files-found: error
          retention-days: 7
