name: V3-10 Beat Visual Grounding Offline

on:
  push:
    branches:
      - chatgpt/v3-10-beat-visual-grounding
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - "scripts/verify_v3_beat_grounding.py"
      - ".github/workflows/v3-beat-grounding.yml"

permissions:
  contents: read

jobs:
  real-frame-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V3 CPU pixel stack and genuine CMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-cmu
          python -m pip install "pydantic>=2" pyyaml pytest "pillow==12.3.0" "kiwisolver==1.5.1"
          fc-match -f '%{family}\n' "CMU Serif"
      - name: Verify V3-10 beat and real MP4 tampering matrix
        run: |
          python -m pytest -q --confcutdir=tests/v3 \
            tests/v3/test_beat_grounding.py \
            tests/v3/test_contracts.py tests/v3/test_signal_preservation.py \
            tests/v3/test_pattern_router.py tests/v3/test_binary_search_trace.py \
            tests/v3/test_pedagogy_planning.py
      - name: Frozen V2, Hermes, preregistration and Core Freeze
        run: |
          python -m pytest -q --confcutdir=tests/v2 \
            tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py \
            tests/v2/test_repair_v2_13_contracts.py
          python -m pytest -q --confcutdir=tests/hermes \
            tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py \
            tests/hermes/test_pedagogy_agent.py tests/hermes/test_script_agent.py
          python scripts/verify_v3_benchmark_protocol.py
          python scripts/verify_learnflow_bench.py
          python scripts/verify_v2_core_freeze.py
      - name: Produce actual decoded verified golden MP4s with per-beat JSON proof
        run: |
          mkdir -p "$RUNNER_TEMP/v3_10_golden"
          python scripts/verify_v3_beat_grounding.py --output-dir "$RUNNER_TEMP/v3_10_golden"
          for case in duplicate missing empty; do
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
              -of default=noprint_wrappers=1 "$RUNNER_TEMP/v3_10_golden/grounded_${case}.mp4"
          done
      - name: Upload MP4 plus machine-readable pixel timeline evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-10-certified-beat-pixel-golden
          path: ${{ runner.temp }}/v3_10_golden/
          if-no-files-found: error
          retention-days: 30
