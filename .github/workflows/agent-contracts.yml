name: Agent Contracts

on:
  pull_request:
    paths:
      - "agent_contracts/**"
      - "hermes/agent-contracts/**"
      - "scripts/verify_agent_contracts.py"
      - "tests/hermes/test_agent_contracts.py"
      - "AGENTS.md"
      - "PLAN_V2.md"
      - ".github/workflows/agent-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "agent_contracts/**"
      - "hermes/agent-contracts/**"
      - "scripts/verify_agent_contracts.py"
      - "tests/hermes/test_agent_contracts.py"
      - "AGENTS.md"
      - "PLAN_V2.md"
      - ".github/workflows/agent-contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install "pydantic>=2" pytest
      - name: Coherent artifact-chain verification
        run: python scripts/verify_agent_contracts.py
      - name: Agent Contracts tests
        run: pytest -q --confcutdir=tests/hermes tests/hermes/test_agent_contracts.py
      - name: Core Freeze guard
        run: python scripts/verify_v2_core_freeze.py
