name: PostgreSQL Persistence

on:
  pull_request:
    paths:
      - "app/repositories/**"
      - "app/config.py"
      - "app/main.py"
      - "requirements.txt"
      - "tests/test_postgres_repository.py"
      - ".github/workflows/postgres-persistence.yml"
  push:
    branches:
      - chatgpt/live-v2d-evaluation
      - main
    paths:
      - "app/repositories/**"
      - "app/config.py"
      - "app/main.py"
      - "requirements.txt"
      - "tests/test_postgres_repository.py"
      - ".github/workflows/postgres-persistence.yml"

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learnflow
          POSTGRES_PASSWORD: learnflow
          POSTGRES_DB: learnflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnflow -d learnflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DATABASE_URL: postgresql://learnflow:learnflow@127.0.0.1:5432/learnflow_test
      DATABASE_URL: postgresql://learnflow:learnflow@127.0.0.1:5432/learnflow_test
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PostgreSQL repository integration
        run: pytest -q tests/test_postgres_repository.py

      - name: Existing API CRUD compatibility
        run: pytest -q tests/test_api_crud.py
