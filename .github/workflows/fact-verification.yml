name: Fact Verification

on:
  pull_request:
    paths:
      - "fact_verification/**"
      - "hermes/fact-verification/**"
      - "scripts/verify_fact_verification.py"
      - "scripts/verify_hermes_fact_verification.py"
      - "tests/hermes/test_fact_verification.py"
      - "AGENTS.md"
      - "PLAN_V2.md"
      - ".github/workflows/fact-verification.yml"
  push:
    branches:
      - main
    paths:
      - "fact_verification/**"
      - "hermes/fact-verification/**"
      - "scripts/verify_fact_verification.py"
      - "scripts/verify_hermes_fact_verification.py"
      - "tests/hermes/test_fact_verification.py"
      - "AGENTS.md"
      - "PLAN_V2.md"
      - ".github/workflows/fact-verification.yml"

jobs:
  deterministic-fact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pydantic>=2" pytest
      - name: Verify factual narration gate
        run: python scripts/verify_fact_verification.py
      - name: Fact Verification tests
        run: pytest -q --confcutdir=tests/hermes tests/hermes/test_fact_verification.py
      - name: Core Freeze guard
        run: python scripts/verify_v2_core_freeze.py

  pinned-hermes-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Hermes runtime
        run: bash scripts/install_hermes_bootstrap.sh
      - name: Prepare isolated Fact Verification profile
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/fact-verification/verify-home"
          rm -rf "$VERIFY_HOME"
          mkdir -p "$VERIFY_HOME"
          cp hermes/bootstrap/config.yaml "$VERIFY_HOME/config.yaml"
      - name: Verify semantic review schema against pinned Hermes
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/fact-verification/verify-home"
          if [[ -x ".hermes_runtime/hermes-agent/venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/venv/bin/python"
          elif [[ -x ".hermes_runtime/hermes-agent/.venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/.venv/bin/python"
          else
            echo "Pinned Hermes Python not found" >&2
            exit 1
          fi
          HERMES_HOME="$VERIFY_HOME" "$HPY" scripts/verify_hermes_fact_verification.py
