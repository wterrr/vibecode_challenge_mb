name: V3-11 Temporal Geometry Offline

on:
  push:
    branches:
      - chatgpt/v3-11-temporal-geometry
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - "scripts/verify_v3_temporal_geometry.py"
      - ".github/workflows/v3-temporal-geometry.yml"

permissions:
  contents: read

jobs:
  swept-temporal-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only renderer and installed Computer Modern
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-cmu
          python -m pip install "pydantic>=2" pyyaml pytest "pillow==12.3.0" "kiwisolver==1.5.1"
          fc-match -f '%{family}\n' "CMU Serif"
      - name: Verify geometric sweeping intermediate collisions and frozen V3 regressions
        run: |
          python -m pytest -q --confcutdir=tests/v3             tests/v3/test_temporal_geometry.py tests/v3/test_beat_grounding.py             tests/v3/test_contracts.py tests/v3/test_signal_preservation.py             tests/v3/test_pattern_router.py tests/v3/test_binary_search_trace.py             tests/v3/test_pedagogy_planning.py
      - name: Frozen V2/Hermes behavior and original benchmark gates
        run: |
          python -m pytest -q --confcutdir=tests/v2             tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py             tests/v2/test_repair_v2_13_contracts.py
          python -m pytest -q --confcutdir=tests/hermes             tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py             tests/hermes/test_pedagogy_agent.py tests/hermes/test_script_agent.py
          python scripts/verify_v3_benchmark_protocol.py
          python scripts/verify_learnflow_bench.py
          python scripts/verify_v2_core_freeze.py
      - name: Actual H264 demo with continuous safety certificate and pixels
        run: |
          mkdir -p "$RUNNER_TEMP/v3_11_evidence"
          python scripts/verify_v3_temporal_geometry.py --output-dir "$RUNNER_TEMP/v3_11_evidence"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames             -of default=noprint_wrappers=1 "$RUNNER_TEMP/v3_11_evidence/temporal_geometry_safe.mp4"
      - name: Upload video and temporal geometry evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-11-swept-geometry-golden
          path: ${{ runner.temp }}/v3_11_evidence/
          if-no-files-found: error
          retention-days: 30
