name: V3-08 Certified Math Blackboard Renderers Offline

on:
  push:
    branches:
      - chatgpt/v3-08-math-blackboard-renderers
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - "scripts/verify_v3_math_patterns.py"
      - ".github/workflows/v3-math-patterns.yml"

permissions:
  contents: read

jobs:
  real-math-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated CPU backend and verified Computer Modern
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-cmu
          python -m pip install "pydantic>=2" pyyaml pytest "pillow==12.3.0" "kiwisolver==1.5.1"
          fc-match -f '%{family}\n' "CMU Serif"
          fc-match -f '%{family}\n' "CMU Typewriter Text"
      - name: V3 contracts, mathematical truth and pixel negative tests
        run: |
          python -m pytest -q --confcutdir=tests/v3 \
            tests/v3/test_contracts.py tests/v3/test_signal_preservation.py \
            tests/v3/test_pattern_router.py tests/v3/test_binary_search_trace.py \
            tests/v3/test_stateful_sequence_renderer.py tests/v3/test_code_process_renderer.py \
            tests/v3/test_math_patterns.py
      - name: Frozen V2, Visual Director, benchmark and Core Freeze
        run: |
          python -m pytest -q --confcutdir=tests/v2 \
            tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py \
            tests/v2/test_repair_v2_13_contracts.py
          python -m pytest -q --confcutdir=tests/hermes \
            tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py
          python scripts/verify_v3_benchmark_protocol.py
          python scripts/verify_learnflow_bench.py
          python scripts/verify_v2_core_freeze.py
      - name: Render actual function and derivation MP4 and validate codec
        run: |
          mkdir -p "$RUNNER_TEMP/v3_08_golden"
          python scripts/verify_v3_math_patterns.py --output-dir "$RUNNER_TEMP/v3_08_golden"
          for name in function_graph equation_derivation; do
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
              -of default=noprint_wrappers=1 "$RUNNER_TEMP/v3_08_golden/\${name}.mp4"
          done
      - name: Upload MP4, PNG and JSON proof only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-08-certified-math-blackboard-golden
          path: ${{ runner.temp }}/v3_08_golden/
          if-no-files-found: error
          retention-days: 30
