name: Lesson Pipeline

on:
  pull_request:
    paths:
      - "lesson_pipeline/**"
      - "hermes/lesson-pipeline/**"
      - "scripts/verify_lesson_pipeline.py"
      - "scripts/verify_hermes_lesson_pipeline.py"
      - "tests/hermes/test_lesson_pipeline.py"
      - ".github/workflows/lesson-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "lesson_pipeline/**"
      - "hermes/lesson-pipeline/**"
      - "scripts/verify_lesson_pipeline.py"
      - "scripts/verify_hermes_lesson_pipeline.py"
      - "tests/hermes/test_lesson_pipeline.py"
      - ".github/workflows/lesson-pipeline.yml"

jobs:
  lesson-pipeline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg graphviz
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2" pillow "kiwisolver==1.5.1" pytest
      - name: Verify real typed query-to-video pipeline
        run: python scripts/verify_lesson_pipeline.py
      - name: Lesson Pipeline tests
        run: pytest -q --confcutdir=tests/hermes tests/hermes/test_lesson_pipeline.py
      - name: Core Freeze guard
        run: python scripts/verify_v2_core_freeze.py

  pinned-hermes-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install exact pinned Hermes runtime
        run: bash scripts/install_hermes_bootstrap.sh
      - name: Prepare isolated End-to-End profile
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/lesson-pipeline/verify-home"
          rm -rf "$VERIFY_HOME"
          mkdir -p "$VERIFY_HOME"
          cp hermes/bootstrap/config.yaml "$VERIFY_HOME/config.yaml"
      - name: Verify structured stage chain and plugin discovery
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/lesson-pipeline/verify-home"
          if [[ -x ".hermes_runtime/hermes-agent/venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/venv/bin/python"
          elif [[ -x ".hermes_runtime/hermes-agent/.venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/.venv/bin/python"
          else
            echo "Pinned Hermes Python not found" >&2
            exit 1
          fi
          HERMES_HOME="$VERIFY_HOME" "$HPY" scripts/verify_hermes_lesson_pipeline.py
          HERMES_HOME="$VERIFY_HOME" HERMES_ENABLE_PROJECT_PLUGINS=true "$HPY" scripts/verify_learnflow_plugin.py
