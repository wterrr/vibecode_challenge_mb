name: V3-91 Genuine ONE Free-Only AI Storyboard POST (unique trigger)
on:
  push:
    branches: [chatgpt/v3-91-free-real-model-storyboard-pilot]
    paths: ['research/V391_SINGLE_FREE_MODEL_TRIGGER.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: V391_SINGLE_REAL_FREE_PROVIDER_POST
  cancel-in-progress: false
jobs:
  exactly_one_zero_cost_provider_attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One-use trigger and Actions history guard
        run: |
          set -euo pipefail
          test "$(cat research/V391_SINGLE_FREE_MODEL_TRIGGER.txt)" = "V391_FREE_ONE_POST_2026_10_19_PREREG_ONLY"
          python - <<'PY'
          import json,os,urllib.request
          url="https://api.github.com/repos/wterrr/vibecode_challenge_mb/actions/workflows/v3-91-free-ai-one-shot-live.yml/runs?per_page=100"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=20) as response: hits=json.load(response)["workflow_runs"]
          current=int(os.environ["GITHUB_RUN_ID"])
          assert int(os.environ["GITHUB_RUN_ATTEMPT"])==1,"V391_RERUN_CANNOT_POST"
          assert not [x for x in hits if x["id"]!=current],"V391_PREVIOUS_POST_RUN_EXISTS"
          print("V391_UNIQUE_LIVE_TRIGGER_VERIFIED")
          PY
      - name: Verified offline host dependencies and tests before any inference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt 'Pillow>=11,<13' 'jsonschema>=4,<5' 'numpy>=1.24,<3' pytest pyyaml
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_91_single_free_ai_pilot.py
          python scripts/verify_v2_core_freeze.py
      - name: ONE actual free-router model POST after zero-price public catalog check
        run: |
          python scripts/run_v3_91_single_free_ai_pilot.py --live-once --output "$RUNNER_TEMP/v391_REAL_AI"
      - name: Require real model provenance and independent native H264 evidence
        run: |
          python - <<'PY'
          import os,json,pathlib
          from learnflow_v3.v364_native_array_compiler import probe,file_sha
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"v391_REAL_AI"
          r=json.loads((root/"v391_attempt.json").read_text())
          assert r["provider_post_attempts"]==1 and r["retry_count"]==0
          assert r["requested_model"]=="openrouter/free"
          assert r["candidate_origin"]=="REAL_PROVIDER_RESPONSE"
          assert r["model_authored_storyboard"]=="VALIDATED_REAL_FREE_MODEL"
          assert r["original_caption_count"]>=2
          assert r["outcome"]=="REAL_FREE_MODEL_TO_NATIVE_TECHNICAL_PASS"
          assert r["native_candidate"]=="REAL_H264_AAC_FULL_DECODE_PASS"
          assert r["production"]=="BLOCKED" and r["human_quality"]=="UNRATED"
          media=json.loads((root/"native_pair/v364_native_receipt.json").read_text())
          assert media["matched_video_frame_counts"]
          for c in media["native_mp4s"]:
              movie=root/"native_pair"/c["name"]
              assert file_sha(movie)==c["sha256"] and probe(movie)==c["native_frames"]
          print("V391_PROVIDER_AUTHORED_NATIVE_TECHNICAL_PASS_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v391-ONE-REAL-FREE-MODEL-OR-TRUTHFUL-BLOCKED-RECEIPT
          path: ${{ runner.temp }}/v391_REAL_AI/
          retention-days: 7
          if-no-files-found: warn
