name: Final V2 Offline Preflight

on:
  push:
    branches:
      - chatgpt/live-v2d-gpt6-luna-paid-pilot
    paths:
      - "lesson_pipeline/**"
      - "live_evaluation/**"
      - "scripts/export_live_v2d_evidence.py"
      - "tests/hermes/test_final_v2_semantic_consistency.py"
      - "tests/hermes/test_final_v2_subtitles.py"
      - "tests/hermes/test_live_v2d_evaluation.py"
      - ".github/workflows/final-v2-offline-preflight.yml"
  workflow_dispatch:

jobs:
  offline-final-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install "pydantic>=2" pyyaml pytest pillow "kiwisolver==1.5.1"
      - name: Verify Core Freeze
        run: python scripts/verify_v2_core_freeze.py
      - name: Verify V2 evaluation contracts
        run: python scripts/verify_live_v2d_evaluation.py
      - name: Regression test paid pilot and short subtitles
        run: pytest -q --confcutdir=tests/hermes tests/hermes/test_live_v2d_evaluation.py tests/hermes/test_final_v2_subtitles.py tests/hermes/test_final_v2_semantic_consistency.py
      - name: Renderer regression
        run: pytest -q --confcutdir=tests/v2 tests/v2/test_render_v2.py
