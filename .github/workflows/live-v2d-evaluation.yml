name: Governed Live V2D Evaluation

concurrency:
  group: live-v2d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - chatgpt/live-v2d-evaluation
      - chatgpt/live-v2d-gpt6-luna-paid-pilot
    paths:
      - "live_evaluation/**"
      - ".hermes/plugins/learnflow/**"
      - "learnflow_v2/**"
      - "lesson_pipeline/**"
      - "visual_director/**"
      - "script_agent/**"
      - "pedagogy_agent/**"
      - "fact_verification/**"
      - "research_orchestration/**"
      - "openrouter_policy.py"
      - "runtime_governance/**"
      - ".hermes/plugins/learnflow-governance/**"
      - "hermes/bootstrap/config.yaml"
      - "scripts/run_live_v2d_pilot.py"
      - "scripts/verify_live_v2d_evaluation.py"
      - "tests/hermes/test_live_v2d_evaluation.py"
      - "tests/v2/test_render_v2.py"
      - ".github/workflows/live-v2d-evaluation.yml"
  pull_request:
    paths:
      - "live_evaluation/**"
      - "scripts/run_live_v2d_pilot.py"
      - "scripts/verify_live_v2d_evaluation.py"
      - "tests/hermes/test_live_v2d_evaluation.py"
      - ".github/workflows/live-v2d-evaluation.yml"
  workflow_dispatch:

jobs:
  live-eval-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2" pyyaml pytest pillow
      - name: Verify governed live-eval contract
        run: python scripts/verify_live_v2d_evaluation.py
      - name: Live-eval regressions
        run: pytest -q --confcutdir=tests/hermes tests/hermes/test_live_v2d_evaluation.py
      - name: Render parity regressions
        run: pytest -q --confcutdir=tests/v2 tests/v2/test_render_v2.py
      - name: Core Freeze guard
        run: python scripts/verify_v2_core_freeze.py

  live-provider-pilot:
    needs: live-eval-contract
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/chatgpt/live-v2d-evaluation' ||
        github.ref == 'refs/heads/chatgpt/live-v2d-gpt6-luna-paid-pilot')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/chatgpt/live-v2d-evaluation' ||
        github.ref == 'refs/heads/chatgpt/live-v2d-gpt6-luna-paid-pilot'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEARNFLOW_LIVE_MODEL_CANDIDATES: openai/gpt-6-luna
      LEARNFLOW_PAID_PILOT_MODEL: openai/gpt-6-luna
      LEARNFLOW_LIVE_TOPIC_ID: lfb-001-cs
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg graphviz fonts-dejavu-core

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Node dependencies
        run: npm ci

      - name: Install exact pinned Hermes runtime
        run: bash scripts/install_hermes_bootstrap.sh

      - name: Prepare isolated Hermes profile
        shell: bash
        run: |
          LIVE_HOME="$PWD/.hermes_runtime/live-v2d-evaluation/hermes-home"
          rm -rf "$LIVE_HOME"
          mkdir -p "$LIVE_HOME"
          cp hermes/bootstrap/config.yaml "$LIVE_HOME/config.yaml"
          echo "HERMES_HOME=$LIVE_HOME" >> "$GITHUB_ENV"
          echo "TERMINAL_CWD=$PWD" >> "$GITHUB_ENV"
          echo "HERMES_ENABLE_PROJECT_PLUGINS=true" >> "$GITHUB_ENV"

      - name: Install LearnFlow dependencies into pinned Hermes env
        shell: bash
        run: |
          if [[ -x ".hermes_runtime/hermes-agent/venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/venv/bin/python"
          elif [[ -x ".hermes_runtime/hermes-agent/.venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/.venv/bin/python"
          else
            echo "Pinned Hermes Python not found" >&2
            exit 1
          fi
          "$HPY" -m ensurepip --upgrade
          "$HPY" -m pip install pillow kiwisolver==1.5.1 edge-tts
          echo "HPY=$HPY" >> "$GITHUB_ENV"

      - name: Run one-topic governed live V2D pilot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "OPENROUTER_API_KEY secret is missing" >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" == "refs/heads/chatgpt/live-v2d-gpt6-luna-paid-pilot" ]]; then
            # Pinned Hermes defaults to 1800s per API request. Under this
            # isolated paid pilot, fail slow requests before GitHub shutdown.
            export HERMES_API_TIMEOUT=150
            export HERMES_API_CALL_STALE_TIMEOUT=120
          fi
          "$HPY" -u scripts/run_live_v2d_pilot.py

      - name: Core Freeze guard
        shell: bash
        run: |
          "$HPY" scripts/verify_v2_core_freeze.py

      - name: Upload redacted live-eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-live-v2d-pilot
          path: .hermes_runtime/live-v2d-evaluation
          if-no-files-found: warn
          retention-days: 14
