name: Kanban Durability

on:
  pull_request:
    paths:
      - "durable_jobs/**"
      - "hermes/kanban/**"
      - "scripts/install_learnflow_worker_profiles.py"
      - "scripts/seed_lesson_job.py"
      - "scripts/verify_kanban_durability.py"
      - "scripts/verify_hermes_kanban_durability.py"
      - "tests/hermes/test_durable_jobs.py"
      - ".github/workflows/kanban-durability.yml"
  push:
    branches:
      - main
    paths:
      - "durable_jobs/**"
      - "hermes/kanban/**"
      - "scripts/install_learnflow_worker_profiles.py"
      - "scripts/seed_lesson_job.py"
      - "scripts/verify_kanban_durability.py"
      - "scripts/verify_hermes_kanban_durability.py"
      - "tests/hermes/test_durable_jobs.py"
      - ".github/workflows/kanban-durability.yml"

jobs:
  durable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2" pyyaml pytest
      - name: Verify durable job contracts
        run: python scripts/verify_kanban_durability.py
      - name: Durable job regressions
        run: pytest -q --confcutdir=tests/hermes tests/hermes/test_durable_jobs.py
      - name: Core Freeze guard
        run: python scripts/verify_v2_core_freeze.py

  pinned-hermes-kanban:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Hermes runtime
        run: bash scripts/install_hermes_bootstrap.sh
      - name: Prepare isolated durability profile
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/kanban-durability/verify-home"
          rm -rf "$VERIFY_HOME" "$PWD/.hermes_runtime/kanban-durability/kanban.db"*
          mkdir -p "$VERIFY_HOME"
          cp hermes/bootstrap/config.yaml "$VERIFY_HOME/config.yaml"
      - name: Verify native persistence and restart recovery
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/kanban-durability/verify-home"
          if [[ -x ".hermes_runtime/hermes-agent/venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/venv/bin/python"
          elif [[ -x ".hermes_runtime/hermes-agent/.venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/.venv/bin/python"
          else
            echo "Pinned Hermes Python not found" >&2
            exit 1
          fi
          HERMES_HOME="$VERIFY_HOME" "$HPY" scripts/verify_hermes_kanban_durability.py
