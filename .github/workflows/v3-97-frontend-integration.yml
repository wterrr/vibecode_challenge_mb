name: V3-97 actual React source and FastAPI E2E (no model API)
on:
  push:
    branches: [chatgpt/v3-97-react-frontend-backend-integration]
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/main.py'
      - 'app/web/react_landing.py'
      - 'tests/test_v3_97_*'
      - 'scripts/v397_browser_e2e.py'
      - '.github/workflows/v3-97-frontend-integration.yml'
jobs:
  actual-frontend-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEARNFLOW_PIPELINE_MODE: fake
      LEARNFLOW_REACT_LANDING: '1'
      ENVIRONMENT: test
      GEMINI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      LEARNFLOW_V3_GPT_ARRAY_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all eight original media SHA256
        working-directory: frontend/learnflow-landing
        run: sha256sum --check asset-manifest.sha256
      - name: Install frontend and test real React source
        working-directory: frontend/learnflow-landing
        run: |
          npm install --no-audit --no-fund
          npm run test:contract
          npm run build
          test -f dist/index.html
          test -d dist/assets
      - name: Install compiled Vite output into FastAPI
        run: python scripts/import_v3_97_frontend_zip.py --install-dist
      - name: Check built MP4 and PNG byte parity
        run: |
          cd frontend/learnflow-landing
          while read -r sha filename; do
            installed="../../app/static/landing/${filename#public/}"
            printf '%s  %s\n' "$sha" "$installed" | sha256sum --check
          done < asset-manifest.sha256
      - name: Install and test actual FastAPI HTTP contract
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_v3_97_frontend_import.py tests/test_v3_97_frontend_full.py
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Launch actual backend without any paid model keys
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/v397-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/v397-server.log
          exit 1
      - name: Real Chromium FE to FastAPI create job and media smoke
        run: python scripts/v397_browser_e2e.py
      - name: Upload original browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-97-real-react-fastapi-evidence
          path: artifacts/v397-browser-*
          if-no-files-found: warn
