name: H01 Hermes Bootstrap

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".env.example"
      - ".gitignore"
      - "hermes/h01/**"
      - "scripts/install_hermes_h01.sh"
      - "scripts/install_hermes_h01.ps1"
      - "scripts/run_hermes_h01_smoke.py"
      - "tests/hermes/**"
      - ".github/workflows/h01-hermes-bootstrap.yml"
  workflow_dispatch:

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependency
        run: pip install pytest
      - name: Offline structured smoke
        run: python scripts/run_hermes_h01_smoke.py --offline-fixture hermes/h01/fixtures/stream_success.jsonl
      - name: H-01 contract tests
        run: pytest -q tests/hermes/test_h01_bootstrap.py
      - name: Prove Core Freeze is untouched
        run: python scripts/verify_v2_core_freeze.py
