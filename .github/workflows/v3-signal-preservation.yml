name: V3-03 Signal Preservation Offline

on:
  push:
    branches:
      - chatgpt/v3-03-signal-preservation-proof
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - ".github/workflows/v3-signal-preservation.yml"

permissions:
  contents: read

jobs:
  signal-invalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only existing offline contract dependencies
        run: python -m pip install "pydantic>=2" pyyaml pytest pillow "kiwisolver==1.5.1"
      - name: V3-02 and V3-03 contract and mutation tests
        run: python -m pytest -q --confcutdir=tests/v3 tests/v3/test_contracts.py tests/v3/test_signal_preservation.py
      - name: V2 reuse regression for artifact DAG and semantic identity
        run: python -m pytest -q --confcutdir=tests/v2 tests/v2/test_repair_v2_13_contracts.py tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py
      - name: Existing agent and numeric drift contract
        run: python -m pytest -q --confcutdir=tests/hermes tests/hermes/test_agent_contracts.py tests/hermes/test_final_v2_semantic_consistency.py
      - name: Frozen V3 benchmark protocol
        run: python scripts/verify_v3_benchmark_protocol.py
      - name: Original LearnFlowBench invariant
        run: python scripts/verify_learnflow_bench.py
      - name: V2 Core Freeze
        run: python scripts/verify_v2_core_freeze.py
