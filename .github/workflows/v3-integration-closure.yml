name: V3 Integration Closure and Reachability Offline

on:
  push:
    branches: [chatgpt/v3-integration-closure-audit]
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - "scripts/audit_v3_reachability.py"
      - "scripts/verify_v3_integration_closure.py"
      - ".github/workflows/v3-integration-closure.yml"

permissions:
  contents: read

jobs:
  integration-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing offline CPU video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-cmu
          python -m pip install "pydantic>=2" pyyaml pytest "pillow==12.3.0" "kiwisolver==1.5.1"
      - name: Run source-to-pixel route, negative tests and all V3 antecedents
        run: |
          python -m pytest -q --confcutdir=tests/v3 \
            tests/v3/test_integration_closure.py \
            tests/v3/test_release_gate.py tests/v3/test_evaluation_manifest.py \
            tests/v3/test_pattern_coverage.py tests/v3/test_artifact_refine.py \
            tests/v3/test_artifact_critic.py tests/v3/test_publish_gate.py \
            tests/v3/test_temporal_geometry.py tests/v3/test_beat_grounding.py \
            tests/v3/test_contracts.py tests/v3/test_signal_preservation.py \
            tests/v3/test_pattern_router.py tests/v3/test_binary_search_trace.py \
            tests/v3/test_pedagogy_planning.py \
            tests/v3/test_stateful_sequence_renderer.py \
            tests/v3/test_code_process_renderer.py tests/v3/test_math_patterns.py
      - name: Verify frozen V2/Hermes/Bench and historical original unchanged
        run: |
          python -m pytest -q --confcutdir=tests/v2 \
            tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py \
            tests/v2/test_repair_v2_13_contracts.py
          python -m pytest -q --confcutdir=tests/hermes \
            tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py \
            tests/hermes/test_pedagogy_agent.py tests/hermes/test_script_agent.py
          python scripts/verify_v3_benchmark_protocol.py
          python scripts/verify_learnflow_bench.py
          python scripts/verify_v2_core_freeze.py
      - name: Render real integration MP4, remux timeline, independently validate all frames, export API inventory
        run: |
          mkdir -p "$RUNNER_TEMP/v3_integration_evidence"
          python scripts/verify_v3_integration_closure.py --output-dir "$RUNNER_TEMP/v3_integration_evidence"
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames \
            -of default=noprint_wrappers=1 \
            "$RUNNER_TEMP/v3_integration_evidence/integrated_binary_lesson.mp4"
      - name: Upload bounded replayed MP4 and dead-code inventory
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-integration-closure-binary-real-h264-and-inventory
          path: ${{ runner.temp }}/v3_integration_evidence/
          retention-days: 30
          if-no-files-found: error
