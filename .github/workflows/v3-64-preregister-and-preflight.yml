name: V3-64 One-Shot Genuine Storyboard Offline Prereg and Negative Gates

on:
  push:
    branches: [chatgpt/v3-64-one-shot-genuine-storyboard]
    paths:
      - "benchmarks/learnflowbench/v3/v3_64_one_shot_genuine_storyboard_preregister.json"
      - "learnflow_v3/v364_heldout_storyboard.py"
      - "learnflow_v3/v364_native_array_compiler.py"
      - "scripts/run_v3_64_one_shot_real_model.py"
      - "scripts/run_v3_64_native_preflight.py"
      - "tests/v3/test_v3_64_one_shot_real_model.py"
      - ".github/workflows/v3-64-preregister-and-preflight.yml"
  pull_request:
    paths:
      - "benchmarks/learnflowbench/v3/v3_64_one_shot_genuine_storyboard_preregister.json"
      - "learnflow_v3/v364_heldout_storyboard.py"
      - "learnflow_v3/v364_native_array_compiler.py"
      - "scripts/run_v3_64_one_shot_real_model.py"
      - "tests/v3/test_v3_64_one_shot_real_model.py"
      - ".github/workflows/v3-64-preregister-and-preflight.yml"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-new-topic-and-provider-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strict source validator and 0-provider fake sender tests
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements.txt "pytest>=8,<10" "pillow>=11,<13" \
            "jsonschema>=4,<5" "numpy>=1.24,<3" pyyaml
          python -m compileall -q \
            learnflow_v3/v364_heldout_storyboard.py \
            learnflow_v3/v364_native_array_compiler.py \
            scripts/run_v3_64_one_shot_real_model.py \
            scripts/run_v3_64_native_preflight.py \
            tests/v3/test_v3_64_one_shot_real_model.py
          python -m pytest -q --confcutdir=tests/v3 \
            tests/v3/test_v3_64_one_shot_real_model.py
      - name: No inference, no third-party source or production mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/run_v3_64_one_shot_real_model.py").read_text()
          assert p.count("post_once(key,raw,send=send)") == 1
          from scripts.run_v3_64_one_shot_real_model import request_payload
          request,_=request_payload()
          assert "temperature" not in request
          print("V364_OFFLINE_PREFLIGHT_NO_NEW_MODEL_POST")
          PY

  full_native_host_test_preflight_no_API:
    needs: frozen-new-topic-and-provider-negative-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic video/test speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check \
            -r requirements.txt "pillow>=11,<13" "jsonschema>=4,<5" \
            "numpy>=1.24,<3" pyyaml
      - name: Real H264 and AAC: render entire two-movie HOST TEST ONLY pair
        run: |
          python scripts/run_v3_64_native_preflight.py \
            --output "$RUNNER_TEMP/V364_HOST_TEST_ONLY_NATIVE"
          ffprobe -v error -show_entries stream=codec_name \
            -of compact "$RUNNER_TEMP/V364_HOST_TEST_ONLY_NATIVE/host_TEST_ONLY.mp4"
          ffprobe -v error -show_entries stream=codec_name \
            -of compact "$RUNNER_TEMP/V364_HOST_TEST_ONLY_NATIVE/model_unverified.mp4"
