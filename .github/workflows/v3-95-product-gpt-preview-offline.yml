name: V3-95 Product GPT Prompt to Video Developer Preview Offline QA
on:
  push:
    branches: [chatgpt/v3-95-live-prompt-to-gpt-video-preview, chatgpt/v3-96-real-browser-gpt-ui-proof]
    paths:
      - 'benchmarks/learnflowbench/v3/v3_95_product_gpt_bridge_preregister.json'
      - 'learnflow_v3/v395_prompt_to_video.py'
      - 'app/config.py'
      - 'app/pipeline/factory.py'
      - 'app/pipeline/v3_preview.py'
      - 'app/api/v3_ai.py'
      - 'app/main.py'
      - 'app/web/routes.py'
      - 'app/templates/create.html'
      - 'app/static/js/app.js'
      - 'tests/v3/test_v3_95_live_gpt_prompt_bridge.py'
      - 'scripts/run_v3_95_offline_product_smoke.py'
      - '.github/workflows/v3-95-product-gpt-preview-offline.yml'
      - 'research/V396_REAL_BROWSER_ONE_GPT_POST_TRIGGER.txt'
      - 'scripts/run_v3_96_real_browser_ui_one_gpt.py'
      - 'tests/v3/test_v3_96_real_browser_source_gate.py'
  pull_request:
    paths:
      - 'benchmarks/learnflowbench/v3/v3_95_product_gpt_bridge_preregister.json'
      - 'learnflow_v3/v395_prompt_to_video.py'
      - 'app/config.py'
      - 'app/pipeline/factory.py'
      - 'app/pipeline/v3_preview.py'
      - 'app/api/v3_ai.py'
      - 'app/main.py'
      - 'app/web/routes.py'
      - 'app/templates/create.html'
      - 'app/static/js/app.js'
      - 'tests/v3/test_v3_95_live_gpt_prompt_bridge.py'
      - 'scripts/run_v3_95_offline_product_smoke.py'
      - '.github/workflows/v3-95-product-gpt-preview-offline.yml'
permissions:
  contents: read
jobs:
  new_prompt_api_and_host_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and offline semantic dependencies, NO paid API key
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt pytest pytest-asyncio
      - name: New prompt/unsupported topic/consent/price API tests, offline only
        run: |
          python -m compileall -q app/api/v3_ai.py app/pipeline/v3_preview.py learnflow_v3/v395_prompt_to_video.py tests/v3/test_v3_95_live_gpt_prompt_bridge.py scripts/run_v3_95_offline_product_smoke.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_95_live_gpt_prompt_bridge.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_94_gpt_timeline_layout.py tests/v3/test_v3_93_paid_gpt6_authoring.py tests/v3/test_v3_92_free_ai_authoring.py tests/v3/test_v3_91_single_free_ai_pilot.py tests/v3/test_v3_64_one_shot_real_model.py
      - name: Core Freeze and immutable source benchmark
        run: |
          python scripts/verify_v2_core_freeze.py
          python scripts/verify_v3_benchmark_protocol.py
      - name: Inspect JS syntax without browser account or network
        run: |
          node --check app/static/js/app.js
  full_dynamic_mock_to_actual_h264_aac:
    needs: new_prompt_api_and_host_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real offline native media tools, no model key
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt
      - name: New query passed from HTTP-format wire, MOCK model response, real native video
        run: |
          python scripts/run_v3_95_offline_product_smoke.py --output "$RUNNER_TEMP/v395_MOCK_PROVIDER_REAL_MP4"
      - name: Assert no fake real-model or production claims and complete media decode
        run: |
          python - <<'PY'
          import os,json,pathlib
          from learnflow_v3.v364_native_array_compiler import probe,file_sha,decode_movie
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"v395_MOCK_PROVIDER_REAL_MP4"
          r=json.loads((root/"v395_preview_receipt.json").read_text())
          assert r["result"]=="MOCK_TO_NATIVE_TECHNICAL_PASS_NOT_REAL_AI"
          assert r["storyboard_origin"]=="MOCK_SENDER_UNATTRIBUTED"
          assert r["production"]=="BLOCKED"
          assert r["human_review"]=="UNRATED"
          assert r["provider_posts"]==1 and r["retry_count"]==0
          assert r["final_video"]=="VERIFIED_PRIVATE_DEVELOPER_PREVIEW"
          old=json.loads((root/"native_pair/v364_native_receipt.json").read_text())
          assert old["matched_video_frame_counts"]
          for x in old["native_mp4s"]:
              v=root/"native_pair"/x["name"]
              assert file_sha(v)==x["sha256"] and probe(v)==x["native_frames"]
              decode_movie(v)
          print("V395_OFFLINE_PRODUCT_GPT_WIRE_MOCKED_VIDEO_REAL_NOT_NEW_AI_SUCCESS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V395-DYNAMIC-PROMPT-MOCK-JSON-REAL-MP4-NOT-AI-EVIDENCE
          path: ${{ runner.temp }}/v395_MOCK_PROVIDER_REAL_MP4/
          retention-days: 5
          if-no-files-found: warn

  v396_actual_chromium_no_key_preflight:
    needs: new_prompt_api_and_host_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: development
      LEARNFLOW_PIPELINE_MODE: demo
      LEARNFLOW_V3_GPT_ARRAY_PREVIEW: 'true'
      ARTIFACTS_DIR: ${{ runner.temp }}/v396_offline_artifacts
      LEARNFLOW_DB_PATH: ${{ runner.temp }}/v396_offline.db
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real local browser but NEVER use provider key
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
      - name: Verify frozen source and actual real browser no-pay protocol
        run: |
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_96_real_browser_source_gate.py
          test -z "$(printenv OPENROUTER_API_KEY || true)"
      - name: Start actual localhost FastAPI + HTML frontend (no model token)
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/v396_no_key.log" 2>&1 &
          for i in $(seq 1 75); do
            curl -fsS http://127.0.0.1:8765/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8765/create >/dev/null
      - name: Chromium actually clicks on form and verifies 422 off-topic ABSTAIN
        run: |
          python scripts/run_v3_96_real_browser_ui_one_gpt.py --offline \
            --output "$RUNNER_TEMP/v396_browser_offline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V396-REAL-CHROMIUM-OFFLINE-ABSTAIN-NO-PAID-PROVIDER
          path: ${{ runner.temp }}/v396_browser_offline/
          retention-days: 5
          if-no-files-found: warn

  v396_one_paid_gpt6_website_ui_proof:
    # Only the user's uniquely authorized trigger commit activates this paid job.
    if: github.event_name == 'push' && github.event.head_commit.message == 'V396_AUTHORIZED_ONE_PAID_BROWSER_TRIGGER'
    needs: [new_prompt_api_and_host_integrity, full_dynamic_mock_to_actual_h264_aac, v396_actual_chromium_no_key_preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: V396_SINGLE_PAID_CHROMIUM_UI_PROOF_GITHUB
      cancel-in-progress: false
    env:
      ENVIRONMENT: development
      LEARNFLOW_PIPELINE_MODE: demo
      LEARNFLOW_V3_GPT_ARRAY_PREVIEW: 'true'
      ARTIFACTS_DIR: ${{ runner.temp }}/v396_real_gpt_artifacts
      LEARNFLOW_DB_PATH: ${{ runner.temp }}/v396_real_gpt.db
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Gate one original paid trigger and no previous trigger/re-run
        run: |
          set -euo pipefail
          test "$(cat research/V396_REAL_BROWSER_ONE_GPT_POST_TRIGGER.txt)" = "V396_AUTH_ONE_REAL_BROWSER_NEW_PROMPT_ONE_GPT6_POST_2026_10_19"
          python - <<'PY'
          import json,os,urllib.request
          assert int(os.environ["GITHUB_RUN_ATTEMPT"])==1,"V396_PAID_RERUN_FORBIDDEN"
          repo="wterrr/vibecode_challenge_mb"
          req=urllib.request.Request("https://api.github.com/repos/"+repo+
              "/actions/workflows/v3-95-product-gpt-preview-offline.yml/runs?branch=chatgpt%2Fv3-96-real-browser-gpt-ui-proof&per_page=100",
              headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(req,timeout=25) as response:runs=json.load(response)["workflow_runs"]
          previous=[r for r in runs if int(r["id"])!=int(os.environ["GITHUB_RUN_ID"]) and
                    (r.get("head_commit") or {}).get("message")=="V396_AUTHORIZED_ONE_PAID_BROWSER_TRIGGER"]
          assert not previous,"V396_PREVIOUS_PAID_BROWSER_TRIGGER_ALREADY_ATTEMPTED"
          print("V396_UNIQUE_AUTHORIZED_REAL_BROWSER_GPT6_GATE")
          PY
      - name: Install actual Chromium app and real narrated MP4 compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_96_real_browser_source_gate.py
      - name: Serve actual app on localhost using real GPT key secret only in backend
        run: |
          test -n "$OPENROUTER_API_KEY"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/v396_real_server.log" 2>&1 &
          for i in $(seq 1 75); do
            curl -fsS http://127.0.0.1:8765/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8765/create >/dev/null
      - name: ONE PAID POST through user-visible Playwright Chromium form (no mock, no retry)
        run: |
          python scripts/run_v3_96_real_browser_ui_one_gpt.py \
            --live-one-paid-post --server-url http://127.0.0.1:8765 \
            --artifacts "$ARTIFACTS_DIR" --output "$RUNNER_TEMP/v396_real_browser"
      - name: Verify actual model attribution, finished provider response and native MP4
        run: |
          python - <<'PY'
          import json,os,pathlib
          from learnflow_v3.v364_native_array_compiler import decode_movie,file_sha,probe
          f=pathlib.Path(os.environ["RUNNER_TEMP"])/"v396_real_browser"
          r=json.loads((f/"v396_browser_receipt.json").read_text())
          assert r["result"]=="GENUINE_GPT_NEW_PROMPT_BROWSER_UI_TO_NATIVE_MP4_TECHNICAL_PASS"
          assert r["provider_posts"]==1 and r["actual_model"]=="openai/gpt-6-luna"
          assert r["finish_reason"]=="stop" and r["storyboard_origin"]=="GENUINE_NEW_GPT_POST"
          assert r["browser_http_post_verified"] and r["private_video_http_get_sha_verified"]
          assert r["production"]=="BLOCKED" and r["human_quality"]=="UNRATED"
          video=f/"v396_REAL_NEW_GPT_UI_video.mp4"
          assert file_sha(video)==r["video_sha256"]
          assert probe(video)==r["frame_count"]
          decode_movie(video)
          print("V396_GENUINE_BROWSER_USER_CLICK_GPT6_MODEL_AUTHORED_NATIVE_MP4_PASS",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V396-ONE-REAL-CHROMIUM-UI-GPT6-OR-HONEST-FAIL
          path: ${{ runner.temp }}/v396_real_browser/
          retention-days: 8
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: V396-PRIVATE-SAFE-FAILED-MODEL-RECEIPT
          path: ${{ runner.temp }}/v396_real_gpt_artifacts/v395safeaudit/*.json
          retention-days: 7
          if-no-files-found: ignore
