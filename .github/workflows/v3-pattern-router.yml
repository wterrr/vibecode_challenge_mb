name: V3-04 Visual Pattern Router Offline

on:
  push:
    branches:
      - chatgpt/v3-04-visual-pattern-router
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - ".github/workflows/v3-pattern-router.yml"

permissions:
  contents: read

jobs:
  visual-pattern-router:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing offline test dependencies
        run: python -m pip install "pydantic>=2" pyyaml pytest pillow "kiwisolver==1.5.1"
      - name: V3-02/03/04 typed and mutation regression
        run: python -m pytest -q --confcutdir=tests/v3 tests/v3/test_contracts.py tests/v3/test_signal_preservation.py tests/v3/test_pattern_router.py
      - name: Reused V2 concept and SceneGraph regression
        run: python -m pytest -q --confcutdir=tests/v2 tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py tests/v2/test_repair_v2_13_contracts.py
      - name: Visual Director and semantic mismatch regression
        run: python -m pytest -q --confcutdir=tests/hermes tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py
      - name: V3-01 benchmark preregistration
        run: python scripts/verify_v3_benchmark_protocol.py
      - name: Existing LearnFlowBench
        run: python scripts/verify_learnflow_bench.py
      - name: Frozen V2 Core
        run: python scripts/verify_v2_core_freeze.py
