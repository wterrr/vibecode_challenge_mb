name: V3-22 Native HD Narrated Lesson Visual Pacing Offline

on:
  push:
    branches: [chatgpt/v3-22-hd-typography-pacing]
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - "scripts/verify_v3_native_hd_lesson.py"
      - ".github/workflows/v3-native-hd-lesson.yml"

permissions:
  contents: read

jobs:
  real-native-hd:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original local speech, fonts and rendering stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-cmu espeak-ng
          python -m pip install -r requirements.txt pytest-asyncio pyyaml
      - name: Create independently rendered 360p and real native 720p H264/AAC
        run: |
          mkdir -p "$RUNNER_TEMP/v3_22_evidence"
          python scripts/verify_v3_native_hd_lesson.py \
            --output-dir "$RUNNER_TEMP/v3_22_evidence"
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames \
            -of default=noprint_wrappers=1 \
            "$RUNNER_TEMP/v3_22_evidence/native_hd/v3_22_binary_search_native_720p.mp4"
      - name: Mutations, source proof, typography and 24fps native decoded replay
        env:
          V3_22_OUTPUT_DIR: ${{ runner.temp }}/v3_22_evidence
        run: |
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_native_hd_lesson.py
      - name: Confirm V3-20 alignment, frozen V2/Hermes and benchmark contracts
        run: |
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_event_alignment_quality.py
          python -m pytest -q --confcutdir=tests/v2 tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py tests/v2/test_repair_v2_13_contracts.py
          python -m pytest -q --confcutdir=tests/hermes tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py tests/hermes/test_pedagogy_agent.py tests/hermes/test_script_agent.py
          python scripts/verify_v3_benchmark_protocol.py
          python scripts/verify_learnflow_bench.py
          python scripts/verify_v2_core_freeze.py
      - name: Save original after-MP4, new native HD MP4, source proof and inspected frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-22-source-matched-native720p24fps-real-h264-aac
          path: |
            ${{ runner.temp }}/v3_22_evidence/source_v3_20/*.mp4
            ${{ runner.temp }}/v3_22_evidence/source_v3_20/*.srt
            ${{ runner.temp }}/v3_22_evidence/source_v3_20/*.json
            ${{ runner.temp }}/v3_22_evidence/native_hd/*.mp4
            ${{ runner.temp }}/v3_22_evidence/native_hd/*.json
            ${{ runner.temp }}/v3_22_evidence/*.json
            ${{ runner.temp }}/v3_22_evidence/*.jpg
          retention-days: 30
          if-no-files-found: error
