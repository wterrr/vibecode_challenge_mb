name: V3-17 Release Candidate Readiness and V2 Rollback Offline

on:
  push:
    branches:
      - chatgpt/v3-17-release-rollback-gate
  pull_request:
    paths:
      - "learnflow_v3/**"
      - "tests/v3/**"
      - "scripts/verify_v3_release_gate.py"
      - ".github/workflows/v3-release-rollback-gate.yml"

permissions:
  contents: read

jobs:
  fail-closed-rc-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing offline CPU renderer stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-cmu
          python -m pip install "pydantic>=2" pyyaml pytest "pillow==12.3.0" "kiwisolver==1.5.1"
      - name: Verify source-bound release audit, rollback mutation and all V3 ancestor tests
        run: |
          python -m pytest -q --confcutdir=tests/v3 \
            tests/v3/test_release_gate.py tests/v3/test_evaluation_manifest.py \
            tests/v3/test_pattern_coverage.py tests/v3/test_artifact_refine.py \
            tests/v3/test_artifact_critic.py tests/v3/test_publish_gate.py \
            tests/v3/test_temporal_geometry.py tests/v3/test_beat_grounding.py \
            tests/v3/test_contracts.py tests/v3/test_signal_preservation.py \
            tests/v3/test_pattern_router.py tests/v3/test_binary_search_trace.py \
            tests/v3/test_pedagogy_planning.py
      - name: Verify frozen V2 and Hermes, 100-topic source, prereg, Bench and Core Freeze
        run: |
          python -m pytest -q --confcutdir=tests/v2 \
            tests/v2/test_concept_registry.py tests/v2/test_scenegraph_validation.py \
            tests/v2/test_repair_v2_13_contracts.py
          python -m pytest -q --confcutdir=tests/hermes \
            tests/hermes/test_visual_director.py tests/hermes/test_final_v2_semantic_consistency.py \
            tests/hermes/test_pedagogy_agent.py tests/hermes/test_script_agent.py
          python scripts/verify_v3_benchmark_protocol.py
          python scripts/verify_learnflow_bench.py
          python scripts/verify_v2_core_freeze.py
      - name: Independently render real H264 twice, decode every frame and rehearse local V2 route
        run: |
          mkdir -p "$RUNNER_TEMP/v3_17_evidence"
          python scripts/verify_v3_release_gate.py --output-dir "$RUNNER_TEMP/v3_17_evidence"
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/v3_17_evidence/primary/grounded_duplicate.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/v3_17_evidence/primary/release_geometry.mp4"
      - name: Retain only proof JSON and permitted example clips, never private reviewer data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-17-release-blocked-rollback-rehearsal
          path: ${{ runner.temp }}/v3_17_evidence/
          if-no-files-found: error
          retention-days: 30
