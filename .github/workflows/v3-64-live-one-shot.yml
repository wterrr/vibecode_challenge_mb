name: V3-64 EXACTLY ONE Genuine GPT-6 Luna Storyboard POST (manual trigger commit)

# Only the explicitly committed trigger file launches an inference POST.
# Editing workflow/code/docs or opening a PR must NEVER send another paid POST.
on:
  push:
    branches: [chatgpt/v3-64-one-shot-genuine-storyboard]
    paths:
      - "research/V364_ONE_SHOT_TRIGGER.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: V364-ONE-SHOT-REAL-API-POST-REPO
  cancel-in-progress: false

jobs:
  single_preapproved_inference_post:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if trigger is absent or a previous one-shot live run exists
        run: |
          set -euo pipefail
          test "$(cat research/V364_ONE_SHOT_TRIGGER.txt)" = "V364_ONCE_APPROVED_2026_10_14_PREREG_F3FE18CE_NO_RETRY"
          python - <<'PY'
          import os,json,urllib.request
          repo="wterrr/vibecode_challenge_mb"
          url=f"https://api.github.com/repos/{repo}/actions/runs?branch=chatgpt%2Fv3-64-one-shot-genuine-storyboard&event=push&per_page=100"
          request=urllib.request.Request(url,headers={
              "Accept":"application/vnd.github+json",
              "Authorization":"Bearer "+os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(request,timeout=22) as response:
              runs=json.load(response)["workflow_runs"]
          current=int(os.environ["CURRENT_RUN_ID"])
          previous=[r["id"] for r in runs
               if r["id"]!=current and
               str(r.get("path","")).endswith("v3-64-live-one-shot.yml")]
          assert not previous, "V364_LIVE_POST_ALREADY_TRIGGERED; DO NOT RETRY"
          print("V364_FIRST_AND_ONLY_LIVE_TRIGGER_VALIDATED")
          PY
      - name: Install host verification and native media decoder without model calls
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check \
            -r requirements.txt "pytest>=8,<10" "pillow>=11,<13" \
            "jsonschema>=4,<5" "numpy>=1.24,<3" pyyaml
      - name: Run hostile verifier & provenance preflight before paying any provider
        run: |
          python -m pytest -q --confcutdir=tests/v3 \
             tests/v3/test_v3_64_one_shot_real_model.py
      - name: Make at most ONE real GPT-6 Luna inference POST then try native render
        run: |
          python scripts/run_v3_64_one_shot_real_model.py \
            --live --output artifacts/v364/one_shot_observation
      - name: Assert non-fabricated response and physical native output, otherwise FAIL
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('artifacts/v364/one_shot_observation')
          receipt=json.loads((root/'attempt_receipt.json').read_text())
          print('V364_OBSERVATION',receipt['outcome'],'client_posts',receipt['provider_post_attempts'])
          assert receipt['provider_post_attempts']==1
          assert receipt['candidate_origin']=='REAL_PROVIDER_RESPONSE'
          assert receipt['outcome']=='BOUNDED_REAL_MODEL_AUTHORING_AND_NATIVE_TECHNICAL_PASS'
          assert receipt['native_movies']==2
          assert receipt['human_quality']=='UNRATED'
          assert receipt['production']=='BLOCKED'
          from learnflow_v3.v364_native_array_compiler import file_sha,probe
          detail=json.loads((root/'native_pair/v364_native_receipt.json').read_text())
          assert detail['matched_video_frame_counts']
          for x in detail['native_mp4s']:
              movie=root/'native_pair'/x['name']
              assert file_sha(movie)==x['sha256']
              assert probe(movie)==x['native_frames']
          print("V364_REAL_PROVIDER_NATIVE_TECHNICAL_PASS_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v364-ONE-SHOT-REAL-RESPONSE-OR-BLOCKED-RECEIPT
          path: artifacts/v364/one_shot_observation/
          if-no-files-found: warn
          retention-days: 14
