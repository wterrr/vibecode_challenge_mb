name: V3-87 Readable Affine Explanation and Continuity (OFFLINE NO MODEL)
on:
  push:
    branches: [chatgpt/v3-87-affine-readability-continuity]
    paths:
      - 'benchmarks/learnflowbench/v3/v3_87_readability_continuity_preregister.json'
      - 'learnflow_v3/v387_readable_affine_continuity.py'
      - 'learnflow_v3/v386_pedagogical_speech_contract.py'
      - 'learnflow_v3/v387_native_readability_gate.py'
      - 'learnflow_v3/v386_phased_affine_manim.py'
      - 'learnflow_v3/v386_native_speech_visual_gate.py'
      - 'learnflow_v3/v385_affine_visual_semantics.py'
      - 'learnflow_v3/v382_query_evidence_bridge.py'
      - 'learnflow_v3/v386_native_speech_visual_gate.py'
      - 'learnflow_v3/v381_finite_manim_compiler.py'
      - 'scripts/run_v3_87_readability_native.py'
      - 'tests/v3/test_v3_87_affine_readability.py'
      - '.github/workflows/v3-87-readability-continuity.yml'
  pull_request:
    paths:
      - 'benchmarks/learnflowbench/v3/v3_87_readability_continuity_preregister.json'
      - 'learnflow_v3/v387_readable_affine_continuity.py'
      - 'learnflow_v3/v386_pedagogical_speech_contract.py'
      - 'learnflow_v3/v387_native_readability_gate.py'
      - 'learnflow_v3/v386_phased_affine_manim.py'
      - 'learnflow_v3/v386_native_speech_visual_gate.py'
      - 'learnflow_v3/v385_affine_visual_semantics.py'
      - 'learnflow_v3/v382_query_evidence_bridge.py'
      - 'learnflow_v3/v386_native_speech_visual_gate.py'
      - 'learnflow_v3/v381_finite_manim_compiler.py'
      - 'scripts/run_v3_87_readability_native.py'
      - 'tests/v3/test_v3_87_affine_readability.py'
      - '.github/workflows/v3-87-readability-continuity.yml'
permissions:
  contents: read
concurrency:
  group: v387-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  source-grounded-query-to-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse pinned fonts ffmpeg espeak, zero provider requests
        timeout-minutes: 11
        run: bash scripts/bootstrap_v3_30_native.sh
      - name: Existing offline Python dependencies
        timeout-minutes: 7
        run: |
          timeout -k 10s 360s python -m pip install --disable-pip-version-check --retries 2 --timeout 30 \
            -r requirements.txt 'numpy>=1.24,<3' pyyaml Pillow
      - name: Pre-registered negative cases, real Hermes gates and old renderer regressions
        timeout-minutes: 7
        run: |
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_87_affine_readability.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_86_typed_narration_visual.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_85_affine_semantics.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_84_scene_composition.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_83_semantic_storytelling.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_82_query_evidence_bridge.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_81_domain_agnostic_semantic.py
          python -m pytest -q --confcutdir=tests/v3 tests/v3/test_v3_80_semantic_transformations.py
      - name: Pull original network-isolated Manim pinned image
        timeout-minutes: 12
        run: timeout -k 10s 680s docker pull manimcommunity/manim:v0.19.0
      - name: Run all five frozen questions and render three native H264 AAC lessons
        timeout-minutes: 29
        run: python scripts/run_v3_87_readability_native.py --output-dir "$RUNNER_TEMP/v387_native"
      - name: Assert full source-to-native and fail-closed outcomes without substitution
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"v387_native"
          final=json.loads((root/"v387_final_report.json").read_text())
          assert final["checkpoint"]=="V3-87"
          assert final["source_supported_native"]==3
          assert final["abstained"]==2
          assert final["locked_denominator"]==5
          assert final["heldout_native"]==1
          assert final["model_api_requests"]==0
          assert final["production"]=="BLOCKED"
          for c in final["cases"]:
              if c["status"]=="ABSTAIN":
                  assert c["video"] is None
                  continue
              path=root/c["id"]/"v387_readable_continuous_native.mp4"
              assert path.is_file() and path.stat().st_size>40000
              assert hashlib.sha256(path.read_bytes()).hexdigest()==c["mp4_sha256"]
              assert c["full_native_decode"]=="PASS"
              assert c["generated_operation_count"]==2
              assert c["voiced_semantic_phase_count"]==len(c["physical_before_after"])==6
              assert c["voice_phase_count"]==len(c["voice_segments"])==6
              assert [x["phase_kind"] for x in c["physical_before_after"]]==["ORIENT","TRANSFORM","INTERPRET"]*2
              assert c["v386_pcm_grounded_semantic_narration"] is True
              assert c["v387_readability_continuity"] is True
              assert len(c["v387_readability_quality_receipt"]["real_h264_readability_witnesses"])==4
              assert c["v387_readability_quality_receipt"]["host_verified_spatial_layout"]["labels_in_distinct_gutter"] is True
              assert c["graph_representation_role"] in ("input_output_line","velocity_vs_elapsed_time")
              assert all(x["timing_claim"]=="TRUE_PCM_SEGMENT_RANGE_NOT_WORD_LEVEL_ALIGNMENT" for x in c["physical_before_after"])
              assert all(x["physical_frame_change_pixels"]>=100 for x in c["physical_before_after"])
              assert c["semantic_affine_role_receipt"]["receipt_sha256"]
              print("V387 READABLE_CONTINUOUS_NATIVE",c["id"],c["mp4_frames"],c["mp4_sha256"])
          PY
      - name: Historical V2 and V3 benchmark frozen contracts
        timeout-minutes: 5
        run: |
          python scripts/verify_v2_core_freeze.py
          python scripts/verify_v3_benchmark_protocol.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v387-readable-continuity-six-phases-3-native-2-abstain
          path: ${{ runner.temp }}/v387_native/
          retention-days: 7
          if-no-files-found: warn
