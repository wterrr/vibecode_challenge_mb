name: V3-96 Registered Offline Browser Runner Smoke
on:
  push:
    branches: [chatgpt/v3-96-real-browser-gpt-ui-proof]
  pull_request:
permissions:
  contents: read
jobs:
  can_register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pure offline source proof (no model, no key)
        run: |
          test -f scripts/run_v3_96_real_browser_ui_one_gpt.py
          python -m compileall -q scripts/run_v3_96_real_browser_ui_one_gpt.py
          echo V396_WORKFLOW_REGISTERED_OFFLINE_NO_INFERENCE
