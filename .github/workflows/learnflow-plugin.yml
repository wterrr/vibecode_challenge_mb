name: LearnFlow Capability Plugin

on:
  pull_request:
    paths:
      - ".hermes/plugins/learnflow/**"
      - "hermes/learnflow-plugin/**"
      - "hermes/bootstrap/**"
      - "scripts/verify_learnflow_plugin.py"
      - "scripts/install_hermes_bootstrap.sh"
      - "tests/hermes/test_learnflow_plugin.py"
      - "AGENTS.md"
      - ".github/workflows/learnflow-plugin.yml"
  push:
    branches:
      - main
    paths:
      - ".hermes/plugins/learnflow/**"
      - "hermes/learnflow-plugin/**"
      - "scripts/verify_learnflow_plugin.py"
      - "tests/hermes/test_learnflow_plugin.py"
      - "AGENTS.md"
      - ".github/workflows/learnflow-plugin.yml"

jobs:
  contract-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plugin test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2" pillow "kiwisolver==1.5.1" pytest
      - name: Plugin contract and real render integration
        run: python -m pytest -q --confcutdir=tests/hermes tests/hermes/test_learnflow_plugin.py
      - name: Core Freeze guard
        run: python scripts/verify_v2_core_freeze.py

  pinned-hermes-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for pinned-runtime render smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install exact pinned Hermes runtime
        run: bash scripts/install_hermes_bootstrap.sh
      - name: Prepare isolated LearnFlow plugin profile
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/learnflow-plugin/verify-home"
          rm -rf "$VERIFY_HOME"
          mkdir -p "$VERIFY_HOME"
          cp hermes/bootstrap/config.yaml "$VERIFY_HOME/config.yaml"
      - name: Install dependencies, discover, and execute through pinned Hermes registry
        shell: bash
        run: |
          VERIFY_HOME="$PWD/.hermes_runtime/learnflow-plugin/verify-home"
          if [[ -x ".hermes_runtime/hermes-agent/venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/venv/bin/python"
          elif [[ -x ".hermes_runtime/hermes-agent/.venv/bin/python" ]]; then
            HPY=".hermes_runtime/hermes-agent/.venv/bin/python"
          else
            echo "Pinned Hermes Python not found" >&2
            exit 1
          fi
          HERMES_HOME="$VERIFY_HOME" HERMES_ENABLE_PROJECT_PLUGINS=true "$HPY" scripts/verify_learnflow_plugin.py
