<dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-desc">
  <div class="dialog-content">
    <h2 id="delete-dialog-title" class="dialog-title">Xóa bài học này?</h2>
    <p id="delete-dialog-desc" class="dialog-desc">
      Video và các tệp liên quan sẽ bị xóa vĩnh viễn. Hành động này không thể hoàn tác.
    </p>
    <div id="delete-error" class="dialog-error" style="display: none;" role="alert"></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" id="btn-cancel-delete">Hủy</button>
      <button type="button" class="btn btn-danger" id="btn-confirm-delete">Xóa bài học</button>
    </div>
  </div>
</dialog>
