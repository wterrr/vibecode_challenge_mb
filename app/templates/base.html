<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LearnFlow — AI Learning Video Studio{% endblock %}</title>
  <meta name="description" content="LearnFlow — AI Learning Video Studio. Biến bất kỳ chủ đề nào thành video bài học ngắn có lời thuyết minh và hình minh họa trực quan." />
  <meta name="application-name" content="LearnFlow AI — AI Learning Video Studio" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css" />
  {% block head %}{% endblock %}
</head>
<body>
  {% include "partials/nav.html" %}

  <main class="main-content" id="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer" id="main-footer">
    <div class="container footer-content">
      <p class="footer-brand"><strong>LearnFlow</strong> — Video bài học trực quan</p>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
